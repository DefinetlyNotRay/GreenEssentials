name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build, test, and verify installable JAR
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }} --console=plain
      - name: Verify the same 26.1 JAR against 26.1.2
        if: matrix.minecraft == '26.1'
        run: ./gradlew verifyDistribution -Pminecraft_version=26.1 -Pcompatibility_version=26.1.2 --console=plain
